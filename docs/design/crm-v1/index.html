<!doctype html>
<html lang="en" class="antialiased">
<head>
<meta charset="utf-8" />
<title>Hypedrive CRM v1</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="icons.js"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: InterVariable, Inter, ui-sans-serif, system-ui, sans-serif;
    --color-ink: #0a0b0d;
    --color-rose-hd: #e11d48;
    --color-well: #f5f5f6;
    --color-well-hover: #eeeef0;
  }
  :root { font-feature-settings: "cv02","cv03","cv04","cv11","ss01"; --ease-out: cubic-bezier(.32,.72,0,1); }

  .sb { width: 248px; transition: width 280ms var(--ease-out); }
  .sb[data-collapsed] { width: 72px; }
  .sb .lbl { white-space: nowrap; transition: opacity 160ms ease 80ms, transform 240ms var(--ease-out) 80ms; }
  .sb[data-collapsed] .lbl { opacity: 0; transform: translateX(-4px); pointer-events: none; transition-delay: 0ms; }
  .sb .logo-clip { width: 104px; transition: width 280ms var(--ease-out), opacity 160ms ease; }
  .sb[data-collapsed] .logo-clip { width: 14px; }
  .sb .cdot { opacity: 0; transition: opacity 160ms ease; }
  .sb[data-collapsed] .cdot { opacity: 1; }
  .sb[data-collapsed] .foot { flex-direction: column; align-items: stretch; }
  .sb[data-collapsed] .foot .lbl { display: none; }
  .sb .tgl { position: absolute; top: 16px; right: 12px; transition: right 280ms var(--ease-out), opacity 160ms ease; }
  .sb[data-collapsed] .tgl { right: 20px; opacity: 0; }
  .sb[data-collapsed]:hover .tgl { opacity: 1; }
  .sb[data-collapsed]:hover .logo-clip { opacity: 0; }

  .nav-a { color: rgb(10 11 13 / .55); transition: color 200ms ease, background-color 200ms ease, transform 120ms ease; }
  .nav-a:hover { color: #0a0b0d; transition-duration: 120ms; }
  .nav-a:not([aria-current]):hover { background: rgb(10 11 13 / .04); }
  .nav-a[aria-current] { color: #0a0b0d; }
  .ind { transition: transform 320ms var(--ease-out); }

  .press { transition: transform 120ms ease, background-color 200ms ease, color 200ms ease; }
  .press:active { transform: scale(.97); }
  .row { transition: background-color 200ms ease, transform 120ms ease; }
  .row:hover { background: #f5f5f6; transition-duration: 120ms; }
  .row:active { transform: scale(.985); }
  .seg-ind { transition: transform 320ms var(--ease-out), width 320ms var(--ease-out); }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise 480ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 60ms); }
  @keyframes shimmer { 0% { background-position: -200% 0 } 100% { background-position: 200% 0 } }
  .sk { background: linear-gradient(90deg,#f1f1f3 25%,#e8e8eb 37%,#f1f1f3 63%); background-size: 400% 100%; animation: shimmer 1.6s ease infinite; border-radius: .5rem; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; transition-delay: 0ms !important; } }
</style>
</head>
<body class="bg-[#eceef1] font-sans text-ink">
<div id="board" class="mx-auto flex max-w-[1764px] flex-col gap-16 p-12"></div>
<script>
const ic = (name, cls = "size-4") => `<i data-icon="${name}" class="${cls}"></i>`;
const dot = (c) => `<span class="size-1.5 shrink-0 rounded-full ${c}"></span>`;
const slash = `<span class="text-ink/20">/</span>`;
const inr = (n) => "₹" + n.toLocaleString("en-IN");
const fig = (n, text) => `<span data-count="${n}" data-text="${text ?? ""}">${text ?? n}</span>`;
const fav = (letter, tint = "bg-white", text = "text-[0.8125rem]") => `<span class="grid size-full place-items-center rounded-[inherit] ${tint} ${text} font-semibold text-ink/70">${letter}</span>`;
const logoTile = (letter, size = "size-11", r = "rounded-xl", text) => `<span class="${size} ${r} shrink-0 overflow-hidden bg-well outline-1 -outline-offset-1 outline-ink/5">${fav(letter, "bg-well", text ?? (/size-1[4-6]/.test(size) ? "text-xl" : undefined))}</span>`;
const avatar = (ini, c = "bg-indigo-100 text-indigo-700", cls = "size-9 text-xs") => `<span class="grid ${cls} shrink-0 place-items-center rounded-full ${c} font-semibold">${ini}</span>`;
const kbd = (k) => `<kbd class="rounded-md bg-white px-1.5 py-0.5 font-sans text-xs font-medium text-ink/50 shadow-[0_0_0_1px_rgba(10,11,13,.08)]">${k}</kbd>`;
const btn = (label, icon = "", cls = "") => `<a href="#" class="press inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-full bg-ink px-4 text-sm font-semibold text-white hover:bg-ink/85 ${cls}">${icon ? ic(icon, "size-3.5") : ""}${label}</a>`;
const quiet = (label, icon = "", cls = "") => `<a href="#" class="press inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-full px-4 text-sm font-medium ring-1 ring-ink/10 ring-inset hover:bg-well ${cls}">${icon ? ic(icon, "size-3.5 text-ink/60") : ""}${label}</a>`;
const wellBtn = (label, icon = "", cls = "") => `<a href="#" class="press inline-flex h-9 shrink-0 items-center justify-center gap-2 rounded-full bg-well px-3.5 text-sm font-medium hover:bg-well-hover ${cls}">${icon ? ic(icon, "size-3.5 text-ink/60") : ""}${label}</a>`;
const iconBtn = (icon, label, cls = "") => `<a href="#" aria-label="${label}" class="press grid size-10 shrink-0 place-items-center rounded-full text-ink/60 hover:bg-well hover:text-ink ${cls}">${ic(icon, "size-4")}</a>`;
const act = (l) => `<span class="press inline-flex h-9 shrink-0 items-center rounded-full bg-white px-4 text-sm font-medium shadow-[0_0_0_1px_rgba(10,11,13,.1)]">${l}</span>`;

/* ---------- shell ---------- */
const NAV = [
  [["activity", "Today"], ["inbox", "Inbox", "7"], ["check-square", "Tasks", "2"]],
  [["eye", "Prospecting"], ["target-05", "Leads", "3"], ["clipboard", "Deals"], ["alert-triangle", "Activation"], ["automation", "Sequences"]],
  [["building", "Accounts", "14"], ["users", "People"], ["bar-chart-10", "Reports"], ["clock", "Activity"], ["message-question", "Playbook"]],
];
const navItem = ([icon, label, count], on) => `
  <li class="relative">
    <a href="#" data-nav ${on ? 'aria-current="page"' : ""} class="nav-a press relative z-10 flex h-9 items-center gap-3 overflow-hidden rounded-xl pr-3 pl-4 text-sm font-medium">
      <span class="relative shrink-0">${ic(icon, "size-4")}${count ? `<span class="cdot absolute -top-0.5 -right-1 size-1.5 rounded-full bg-ink/40"></span>` : ""}</span>
      <span class="lbl min-w-0 flex-1 truncate">${label}</span>
      ${count ? `<span class="lbl text-[0.8125rem] font-normal text-ink/35 tabular-nums">${count}</span>` : ""}
    </a>
  </li>`;
const hair = `<li aria-hidden="true" class="mx-4 my-3 h-px bg-ink/[0.07]"></li>`;
const sidebar = ({ active = "Today", collapsed } = {}) => `
  <aside class="sb relative shrink-0 border-r border-ink/[0.06] bg-[#fafafa]" ${collapsed ? "data-collapsed" : ""}>
    <div class="sticky top-0 flex flex-col pb-6">
      <div class="relative flex h-16 shrink-0 items-center pl-7">
        <span class="logo-clip block overflow-hidden"><img src="logo.svg" alt="Hypedrive" class="h-5 w-auto max-w-none" /></span>
        <div class="tgl"><button data-collapse aria-label="Collapse sidebar" class="nav-a press grid size-8 place-items-center rounded-lg">${ic("sidebar", "size-4")}</button></div>
      </div>
      <nav aria-label="Primary" class="mt-2">
        <ul class="nav relative flex flex-col gap-0.5 px-3">
          <span aria-hidden="true" class="ind pointer-events-none absolute top-0 right-3 left-3 h-9 rounded-xl bg-white shadow-[0_1px_2px_rgba(10,11,13,.06),0_0_0_1px_rgba(10,11,13,.06)]"></span>
          ${NAV.map((g) => g.map((n) => navItem(n, n[1] === active)).join("")).join(hair)}
          ${hair}
        </ul>
      </nav>
      <div class="foot flex items-center gap-0.5 px-3">
        <a href="#" class="nav-a press flex h-9 min-w-0 flex-1 items-center gap-3 overflow-hidden rounded-xl pr-3 pl-4 text-sm font-medium">${ic("settings", "size-4 shrink-0")}<span class="lbl truncate">Settings</span></a>
        <a href="#" aria-label="Invite teammates" class="nav-a press grid h-9 min-w-9 place-items-center rounded-xl">${ic("user-plus", "size-4")}</a>
        <a href="#" aria-label="Help and shortcuts" class="nav-a press grid h-9 min-w-9 place-items-center rounded-xl">${ic("message-question", "size-4")}</a>
      </div>
      <p class="lbl mt-6 px-7 text-xs text-ink/35">Pinned</p>
      <ul class="mt-1 flex flex-col gap-0.5 px-3">${navItem(["building", "Drogo"])}${navItem(["clipboard", "Nykaa launch pilot"])}</ul>
    </div>
  </aside>`;

const topBar = ({ wide } = {}) => `
  <header class="sticky top-0 z-20 bg-white/85 backdrop-blur-xl">
    <div class="mx-auto grid h-16 ${wide ? "" : "max-w-[1200px]"} grid-cols-12 items-center gap-x-8 px-10">
      <button class="press ${wide ? "col-span-6" : "col-span-8"} flex h-10 items-center gap-2.5 rounded-full bg-well pr-2 pl-4 text-left text-sm text-ink/45 hover:bg-well-hover">
        ${ic("search", "size-4 shrink-0")}<span class="flex-1 truncate">Search accounts, people, deals</span>${kbd("⌘K")}
      </button>
      <div class="${wide ? "col-span-6" : "col-span-4"} flex items-center justify-end gap-1">
        <button aria-label="Notifications, 3 unread" class="press relative grid size-10 place-items-center rounded-full text-ink/60 hover:bg-well hover:text-ink">${ic("bell", "size-4")}<span class="absolute top-2 right-2.5 size-2 rounded-full bg-ink ring-2 ring-white"></span></button>
        <button class="press -mr-1 flex h-10 items-center gap-2 rounded-full py-0.5 pr-3 pl-0.5 text-sm font-medium hover:bg-well">${avatar("SG")}Shivam Gupta${ic("chevron-down", "size-3 text-ink/40")}</button>
      </div>
    </div>
  </header>`;

const head = ({ crumbs, title, meta, actions = "", lead = "", phone }) => `
  <section class="rise flex ${phone ? "flex-col gap-4" : "items-end justify-between gap-8"}">
    <div class="flex min-w-0 items-center gap-5">
      ${lead}
      <div class="min-w-0">
        ${crumbs ? `<p class="flex items-center gap-1.5 text-sm text-ink/45">${crumbs.map((c) => `<a href="#" class="hover:text-ink">${c}</a>`).join(slash)}</p>` : ""}
        <h1 class="${crumbs ? "mt-1" : ""} ${phone ? "text-[1.875rem]/[1.1]" : "text-[2.75rem]/[1.1]"} font-semibold tracking-[-0.035em] text-balance">${title}</h1>
        ${meta ? `<p class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-[0.9375rem] text-ink/55 tabular-nums">${meta}</p>` : ""}
      </div>
    </div>
    ${actions ? `<div class="flex shrink-0 items-center gap-2">${actions}</div>` : ""}
  </section>`;

const sectionHead = (title, link, count) => `
  <div class="flex h-7 items-center justify-between gap-4">
    <h2 class="text-[1.0625rem] font-semibold tracking-[-0.01em]">${title}${count ? `<span class="ml-1.5 font-medium text-ink/35 tabular-nums">${count}</span>` : ""}</h2>
    ${link ? `<a href="#" class="press -mr-2 rounded-full px-2 py-1 text-sm font-medium text-ink/55 hover:bg-well hover:text-ink">${link}</a>` : ""}
  </div>`;

const seg = (items, on = 0, cls = "") => `
  <div class="seg relative inline-flex rounded-full bg-well p-1 ${cls}">
    <span aria-hidden="true" class="seg-ind absolute top-1 bottom-1 left-0 rounded-full bg-white shadow-[0_1px_2px_rgba(10,11,13,.06),0_0_0_1px_rgba(10,11,13,.06)]"></span>
    ${items.map(([l, n], i) => `<button data-seg ${i === on ? 'aria-pressed="true"' : ""} class="press relative z-10 inline-flex h-8 items-center gap-1.5 rounded-full px-3.5 text-sm font-medium ${i === on ? "text-ink" : "text-ink/50 hover:text-ink"}">${l}${n !== undefined ? `<span class="text-ink/35 tabular-nums">${n}</span>` : ""}</button>`).join("")}
  </div>`;

const searchPill = (ph, w = "w-72") => `<label class="flex h-10 ${w} items-center gap-2.5 rounded-full bg-well pr-2 pl-4 text-sm text-ink/45">${ic("search", "size-3.5 shrink-0")}<span class="flex-1 truncate">${ph}</span>${kbd("/")}</label>`;
const chip = (label, value) => `<button class="press inline-flex h-10 items-center gap-1.5 rounded-full bg-well px-4 text-sm hover:bg-well-hover"><span class="text-ink/45">${label}</span><span class="font-medium">${value}</span>${ic("chevron-down", "size-3 text-ink/35")}</button>`;
const toolbar = ({ search, chips = "", actions = "" }) => `
  <div class="rise mt-6 flex items-center gap-2">
    ${search ? searchPill(search) : ""}${chips}
    <div class="ml-auto flex items-center gap-2">${actions}</div>
  </div>`;
const stats = (items, cls = "") => `
  <div class="rise grid rounded-2xl bg-well p-1 ${cls}" style="grid-template-columns:repeat(${items.length},minmax(0,1fr))">
    ${items.map(([l, n, c, text, tone]) => `
      <a href="#" class="row rounded-xl px-4 py-3 hover:!bg-white">
        <p class="flex items-center gap-1.5 text-xs text-ink/50">${c ? dot(c) : ""}<span class="truncate">${l}</span></p>
        <p class="mt-1 text-xl font-semibold tabular-nums ${tone ?? ""}">${fig(n, text)}</p>
      </a>`).join("")}
  </div>`;

/* ---------- frames ---------- */
const caption = (label, note = "") => `<figcaption class="mb-3 flex items-baseline gap-3"><span class="text-xs font-semibold tracking-[0.08em] text-ink/45 uppercase">${label}</span>${note ? `<span class="text-xs text-ink/35">${note}</span>` : ""}</figcaption>`;
const desktop = (label, { active, collapsed, wide, body, height = "", overlay = "" }) => `
  <figure>
    ${caption(label, "1440 wide")}
    <div data-frame class="relative flex overflow-hidden rounded-[1.25rem] bg-white shadow-[0_40px_100px_-40px_rgba(0,0,0,.22),0_0_0_1px_rgba(10,11,13,.04)] ${height}" style="width:1440px">
      ${sidebar({ active, collapsed })}
      <div class="min-w-0 flex-1">
        ${topBar({ wide })}
        <main class="mx-auto ${wide ? "" : "max-w-[1200px]"} px-10 pt-6 pb-16">${body}</main>
      </div>
      ${overlay}
    </div>
  </figure>`;

const TABS = [["activity", "Today"], ["inbox", "Inbox"], ["check-square", "Tasks"], ["target-05", "Leads"]];
const tabBar = (on = "Today") => `
  <div class="absolute inset-x-4 bottom-5 flex items-center gap-2.5">
    <nav aria-label="Primary" class="flex h-[3.75rem] flex-1 items-center gap-1 rounded-full bg-white/80 p-1.5 shadow-[0_8px_30px_-8px_rgba(10,11,13,.22),0_0_0_1px_rgba(10,11,13,.06)] backdrop-blur-xl">
      ${TABS.map(([i, l]) => `
        <a href="#" class="press relative flex h-full flex-1 flex-col items-center justify-center gap-1 rounded-full text-[0.6875rem] font-medium ${l === on ? "bg-ink/[0.06] text-ink" : "text-ink/45"}">
          ${ic(i, "size-5")}<span>${l}</span>${l === "Inbox" ? `<span class="absolute top-2 right-[calc(50%-14px)] size-2 rounded-full bg-ink ring-2 ring-white"></span>` : ""}
        </a>`).join("")}
    </nav>
    <a href="#" aria-label="More" class="press grid size-[3.75rem] shrink-0 place-items-center rounded-full bg-white/80 text-ink/60 shadow-[0_8px_30px_-8px_rgba(10,11,13,.22),0_0_0_1px_rgba(10,11,13,.06)] backdrop-blur-xl">${ic("dots-horizontal", "size-5")}</a>
  </div>`;
const phone = (label, { body, tab, sheet = "" }) => `
  <figure class="shrink-0">
    ${caption(label)}
    <div data-frame class="relative h-[844px] w-[390px] overflow-hidden rounded-[2.75rem] bg-white shadow-[0_40px_100px_-40px_rgba(0,0,0,.3)] ring-1 ring-black/5">
      <div class="flex h-14 items-center gap-1 px-5 pt-3">
        <img src="logo.svg" class="h-[18px]" alt="Hypedrive" />
        <span class="ml-auto grid size-10 place-items-center rounded-full text-ink/70">${ic("search", "size-4")}</span>
        <span class="relative grid size-10 place-items-center rounded-full text-ink/70">${ic("bell", "size-4")}<span class="absolute top-2.5 right-2.5 size-2 rounded-full bg-ink ring-2 ring-white"></span></span>
        ${avatar("SG", undefined, "size-8 text-[0.6875rem]")}
      </div>
      <div class="flex flex-col gap-8 px-5 pt-4 pb-28">${body}</div>
      <div class="pointer-events-none absolute inset-x-0 bottom-0 h-32 bg-gradient-to-t from-white from-30% to-transparent"></div>
      ${tabBar(tab)}
      ${sheet}
    </div>
  </figure>`;

/* ---------- Today ---------- */
const metaToday = `<span class="inline-flex items-center gap-1.5 font-medium text-amber-700">${dot("bg-amber-500")}1 lead waiting</span>${slash}<span>1 due today</span>${slash}<span>3 stuck brands</span>`;
const focusLead = ({ phone } = {}) => phone ? `
  <section class="rise rounded-3xl bg-well p-4">
    <div class="flex items-start gap-4">
      ${avatar("DM", "bg-emerald-50 text-emerald-700", "size-12 text-sm")}
      <div class="min-w-0 flex-1 pt-0.5">
        <p class="inline-flex items-center gap-1.5 text-[0.8125rem] font-medium text-amber-700">${ic("clock", "size-3.5")}Waiting 4h 8m, past the 1h reply goal</p>
        <h2 class="mt-1 text-[1.0625rem]/6 font-semibold tracking-[-0.015em]">Dev Malhotra, Green Roots</h2>
      </div>
    </div>
    ${btn("Call Dev", "phone", "mt-4 h-11 w-full")}
  </section>` : `
  <section class="rise flex h-full flex-col justify-between gap-8 rounded-[1.75rem] bg-well p-7">
    <div class="flex items-start gap-5">
      ${avatar("DM", "bg-emerald-50 text-emerald-700", "size-14 text-base")}
      <div class="min-w-0">
        <p class="inline-flex items-center gap-1.5 text-sm font-medium text-amber-700">${ic("clock", "size-3.5")}Waiting 4h 8m, past the 1h reply goal</p>
        <h2 class="mt-2 text-2xl/[1.2] font-semibold tracking-[-0.02em]">Dev Malhotra from Green Roots asked for a demo</h2>
        <p class="mt-2 max-w-[48ch] text-[0.9375rem]/6 text-pretty text-ink/55">Came in through the contact form. Sells on Amazon and Nykaa, around 40 listings. Reply first, then qualify.</p>
      </div>
    </div>
    <div class="flex items-center gap-2 pl-[4.75rem]">
      ${btn("Call Dev", "phone", "h-11 px-5")}${quiet("Open lead", "", "h-11")}
      <span class="ml-auto text-sm text-ink/45">Contact form · Inbound</span>
    </div>
  </section>`;
const month = ({ phone } = {}) => `
  <section class="rise relative flex h-full flex-col overflow-hidden rounded-[1.75rem] bg-white p-6 shadow-[0_10px_40px_-18px_rgba(10,11,13,.22),0_0_0_1px_rgba(10,11,13,.06)]">
    <div class="pointer-events-none absolute -top-24 -right-24 size-60 rounded-full bg-rose-hd/[0.07] blur-3xl"></div>
    <p class="relative text-sm text-ink/50">Won this month</p>
    <p class="relative mt-1 ${phone ? "text-[2.25rem]" : "text-[2.75rem]"}/none font-semibold tracking-[-0.035em] text-rose-hd tabular-nums">${fig(180000, "₹1.8L")}</p>
    <div class="relative mt-4"><div class="flex h-1.5 overflow-hidden rounded-full bg-ink/[0.06]"><span class="w-[36%] rounded-full bg-rose-hd"></span></div><p class="mt-2 text-xs text-ink/45 tabular-nums">36% of the ₹5L target · 9 days left</p></div>
    <dl class="relative mt-5 flex flex-col gap-3 border-t border-ink/[0.06] pt-4 text-sm tabular-nums">
      <div class="flex items-baseline justify-between"><dt class="text-ink/50">Open pipeline</dt><dd class="font-medium">₹5.5L</dd></div>
      <div class="flex items-baseline justify-between"><dt class="text-ink/50">Activations</dt><dd class="font-medium">3</dd></div>
      <div class="flex items-baseline justify-between"><dt class="text-ink/50">Calls and meetings</dt><dd class="font-medium">14</dd></div>
    </dl>
  </section>`;
const taskRow = ({ title, sub, tone, trail, lead }) => `
  <li><a href="#" class="row -mx-3 flex min-h-[4.25rem] items-center gap-4 rounded-2xl px-3 py-2.5">
    ${lead}
    <div class="min-w-0 flex-1"><p class="truncate text-[0.9375rem] font-medium">${title}</p><p class="mt-0.5 flex min-w-0 items-center gap-1.5 text-sm text-ink/50">${dot(tone)}<span class="truncate">${sub}</span></p></div>
    ${trail}
  </a></li>`;
const checkLead = `<span class="grid size-11 shrink-0 place-items-center rounded-xl bg-well text-ink/50">${ic("check-square", "size-4")}</span>`;
const upNext = ({ phone } = {}) => `
  <section class="rise">
    ${sectionHead("Up next", "All tasks", "3")}
    <ul class="mt-2">
      ${taskRow({ lead: checkLead, title: "Send revised proposal with bundled price", sub: phone ? "Drogo · today" : "Drogo · due today · high", tone: "bg-amber-500", trail: act("Done") })}
      ${taskRow({ lead: checkLead, title: "Prepare demo around their Nykaa listings", sub: "Kesar Leaf Naturals · tomorrow", tone: "bg-sky-500", trail: phone ? "" : `<span class="text-sm text-ink/45">Tomorrow</span>` })}
      ${taskRow({ lead: checkLead, title: "Win-back call: ask what changed", sub: "Glow Theory · Monday", tone: "bg-sky-500", trail: phone ? "" : `<span class="text-sm text-ink/45">Mon</span>` })}
    </ul>
  </section>`;
const stuck = () => `
  <section class="rise">
    ${sectionHead("Stuck brands", "Activation", "3")}
    <ul class="mt-2">
      ${[["G", "Glow Theory", "Renewal due · 9 days", "bg-amber-500"], ["S", "Snackwala", "GST failed · 24 hours", "bg-red-500"], ["D", "Drogo", "Paused, no funds · 13 hours", "bg-amber-500"]].map(([l, t, s, c]) => `

for (const el of document.querySelectorAll("i[data-icon]")) {

  svg.setAttribute("viewBox", def.viewBox); svg.setAttribute("aria-hidden", "true"); svg.setAttribute("fill", "none");

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const ul = sb.querySelector(".nav"), ind = ul.querySelector(".ind");

  new ResizeObserver(() => { ind.style.transition = "none"; place(s.querySelector("[aria-pressed]")); ind.offsetWidth; ind.style.transition = ""; }).observe(s);
  for (const b of s.querySelectorAll("[data-seg]")) b.addEventListener("click", () => {

document.addEventListener("click", (e) => { if (e.target.closest('a[href="#"]')) e.preventDefault(); });

const ease = (t) => 1 - Math.pow(1 - t, 3);
const countUp = () => {
  for (const el of document.querySelectorAll("[data-count]")) {
    const end = +el.dataset.count, text = el.dataset.text;
    if (reduce || !end) { el.textContent = text; continue; }
    const fmt = (v) => text.startsWith("₹") ? (text.includes("L") ? `₹${(v / 100000).toFixed(1)}L` : inr(v)) : text.endsWith("%") ? `${v}%` : String(v);
    const t0 = performance.now() + 180;
    const tick = (now) => { const p = Math.min(1, Math.max(0, (now - t0) / 700)); el.textContent = p >= 1 ? text : fmt(Math.round(end * ease(p))); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
};
const stagger = () => {
  for (const f of document.querySelectorAll("[data-frame]")) [...f.querySelectorAll(".rise")].forEach((el, i) => { el.style.setProperty("--i", i); el.style.animation = "none"; el.offsetWidth; el.style.animation = ""; });

};
